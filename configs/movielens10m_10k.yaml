extends: base.yaml

# Unified COSTA dataset profile for the official GroupLens MovieLens 10M source.
# Shared simulation, outcome, optimization, and monitoring defaults are
# inherited from configs/base.yaml.
data:
  dataset: movielens
  raw_dir: data/raw/ml-10m
  output_root: data/processed
  n_items: 10000
  n_blocks: 4
  top_k: 10
  embed_dim: 64
  include_embed_dim_in_name: false
  min_user_events: 3

simulation:
  prepared_dir: data/processed/movielens_top10k_b4_k10
