extends: base.yaml

# Unified COSTA dataset profile for RetailRocket. Shared simulation, outcome,
# optimization, and monitoring defaults are inherited from configs/base.yaml.
data:
  dataset: retailrocket
  raw_dir: data/raw/retailrocket
  output_root: data/processed
  n_items: 10000
  n_blocks: 4
  top_k: 10
  embed_dim: 64
  include_embed_dim_in_name: false
  min_user_events: 3

simulation:
  prepared_dir: data/processed/retailrocket_top10k_b4_k10
