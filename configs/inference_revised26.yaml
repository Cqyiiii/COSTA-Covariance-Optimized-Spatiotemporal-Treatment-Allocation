# Reference specification for the revised26 supplementary inference experiment.
# The executable commands are in README.md and
# scripts/run_required_inference_revised26.sh.
models: linear
p_values: [0.5]
designs:
  - independent
  - rbsd_approx
  - COSTA
  - COSTA_IC_lam1
mc: 1000
mean_calibration_mc: 500
tail_calibration_mc: 500
ci_level: 0.95
burn_in: 1
pair_batch: 10000
tail_outcome_mode: conditional_mean
item_shock_sd: 0.0
block_shock_sd: 0.0
alpha_hat_item_sd: 0.0
alpha_hat_block_sd: 0.0
alpha_hat_cell_sd: 0.0
steps: 400
d_item: 16
d_time: auto
n_far_pairs: 50000
locality_time_gap: 2
